<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI FAQ Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div>
        <h1>AI FAQ Chatbot</h1>
        <p>Simple chatbot style interface for common questions</p>
      </div>
      <button id="themeToggle" class="toggle-btn">Dark Mode</button>
    </header>

    <main class="chat-box" id="chatBox">
      <div class="message bot">
        <span>Hi, I can answer basic questions about the project.</span>
      </div>
    </main>

    <form id="chatForm" class="input-area">
      <input
        type="text"
        id="userInput"
        placeholder="Type your message..."
        autocomplete="off"
      />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
